<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300"><rect width="1000" height="300" fill="#f3f7fa"/><g font-family="sans-serif"><text x="35" y="45" font-size="25" fill="#102b46">熔断器的受控恢复</text><rect x="35.0" y="90" width="158.0" height="80" rx="8" fill="#174965"/><text x="114.0" y="138" text-anchor="middle" font-size="21" fill="white">关闭统计</text><path d="M196.0 130h20m-6 -6l6 6l-6 6" stroke="#174965" stroke-width="3" fill="none"/><rect x="221.0" y="90" width="158.0" height="80" rx="8" fill="#174965"/><text x="300.0" y="138" text-anchor="middle" font-size="21" fill="white">达到阈值</text><path d="M382.0 130h20m-6 -6l6 6l-6 6" stroke="#174965" stroke-width="3" fill="none"/><rect x="407.0" y="90" width="158.0" height="80" rx="8" fill="#174965"/><text x="486.0" y="138" text-anchor="middle" font-size="21" fill="white">打开拒绝</text><path d="M568.0 130h20m-6 -6l6 6l-6 6" stroke="#174965" stroke-width="3" fill="none"/><rect x="593.0" y="90" width="158.0" height="80" rx="8" fill="#174965"/><text x="672.0" y="138" text-anchor="middle" font-size="21" fill="white">半开探测</text><path d="M754.0 130h20m-6 -6l6 6l-6 6" stroke="#174965" stroke-width="3" fill="none"/><rect x="779.0" y="90" width="158.0" height="80" rx="8" fill="#174965"/><text x="858.0" y="138" text-anchor="middle" font-size="21" fill="white">恢复关闭</text><text x="35" y="230" font-size="20" fill="#24475e">半开探测失败则重新打开；旧请求的迟到结果不得改变新状态。</text></g></svg>